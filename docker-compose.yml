version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: mycampus-mysql
    restart: always
    environment:
      MYSQL_DATABASE: mycampus
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mycampus-phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"

  backend:
    build: ./backend
    container_name: mycampus-backend
    ports:
      - "8080:8080"
    environment:
      APP_FILES_BASE_DIR: /data/uploads
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - uploads_data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend-web
    container_name: mycampus-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:

