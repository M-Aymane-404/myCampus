version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: mycampus-mysql
    restart: always
    environment:
      MYSQL_DATABASE: mycampus
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mycampus-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mycampus-phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - mycampus-network

  backend:
    build: ./backend
    container_name: mycampus-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/mycampus?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: myuser
      DB_PASSWORD: mypassword
      JWT_SECRET: bXljYW1wdXNfc2VjdXJlX2p3dF9rZXlfdGhpc19zaG91bGRfYmVfbG9uZ19lbm91Z2hfZm9yX2hzNTEyXzIwMjY=
      RECAPTCHA_SECRET: 6Lf2-H4sAAAAAOI1d4c35Xf_msfrb1pN6EAcIhFX
      APP_FILES_BASE_DIR: /data/uploads
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      APP_SECURITY_COOKIE_SECURE: "false"
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - uploads_data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mycampus-network

  frontend:
    build: ./frontend-web
    container_name: mycampus-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mycampus-network

  n8n:
    image: n8nio/n8n:latest
    container_name: mycampus-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      GENERIC_TIMEZONE: Africa/Casablanca
      WEBHOOK_URL: http://localhost:5678
      N8N_RESTRICT_FILE_ACCESS_TO: /data/uploads;/home/node/.n8n-files
      N8N_WORKFLOWS_IMPORT_PATH: /home/node/workflows
    volumes:
      - n8n_data:/home/node/.n8n
      - uploads_data:/data/uploads
      - ./n8n/workflows:/home/node/workflows:ro
    depends_on:
      - backend
      - mysql
    networks:
      - mycampus-network 

volumes:
  mysql_data:
  uploads_data:
  n8n_data: 
networks:
  mycampus-network:
    driver: bridge

