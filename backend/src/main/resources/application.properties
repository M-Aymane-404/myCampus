spring.application.name=mycampus
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/mycampus?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=false}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

jwt.secret-key=${JWT_SECRET}
recaptcha.secret=${RECAPTCHA_SECRET}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}
app.security.access-token-ttl-minutes=${APP_SECURITY_ACCESS_TOKEN_TTL_MINUTES:2}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
app.files.base-dir=${APP_FILES_BASE_DIR:uploads}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

server.address=0.0.0.0
